{
  "name": "Build Reverie",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "jobs": {
    "build": {
      "name": "${{ matrix.name }}",
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "name": "macOS",
              "os": "macos-latest",
              "cmake_args": "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
            },
            {
              "name": "Windows",
              "os": "windows-latest",
              "cmake_args": "-DREVERIE_CI=ON"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Configure",
          "shell": "bash",
          "run": "cmake -B build -DCMAKE_BUILD_TYPE=Release \"${{ matrix.cmake_args }}\""
        },
        {
          "name": "Build",
          "run": "cmake --build build --config Release --parallel"
        },
        {
          "name": "Package VST3 (macOS)",
          "if": "matrix.name == 'macOS'",
          "run": "mkdir -p dist\ncodesign --force --deep --sign - build/Reverie_artefacts/Release/VST3/Reverie.vst3\nditto -c -k --keepParent build/Reverie_artefacts/Release/VST3/Reverie.vst3 dist/Reverie-VST3-macOS.zip"
        },
        {
          "name": "Package AU (macOS)",
          "if": "matrix.name == 'macOS'",
          "continue-on-error": true,
          "run": "mkdir -p dist\ncodesign --force --deep --sign - build/Reverie_artefacts/Release/AU/Reverie.component\nditto -c -k --keepParent build/Reverie_artefacts/Release/AU/Reverie.component dist/Reverie-AU-macOS.zip"
        },
        {
          "name": "Package VST3 (Windows)",
          "if": "matrix.name == 'Windows'",
          "shell": "pwsh",
          "run": "New-Item -ItemType Directory -Force -Path dist | Out-Null\nCompress-Archive -Path build/Reverie_artefacts/Release/VST3/Reverie.vst3 -DestinationPath dist/Reverie-VST3-Windows.zip"
        },
        {
          "name": "Upload",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "Reverie-${{ matrix.name }}",
            "path": "dist/*.zip",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
